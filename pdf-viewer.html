<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF | Zay-Marie Press</title><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="assets/zay-marie-press-favicon.png">
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#1a2438;font-family:Arial,sans-serif}
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#0b1628;border-bottom:1px solid #1d2a40}
.bar span{color:#d4af37;font:700 16px Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .r{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.bar a.dl{color:#c4cad4;font-size:13px;font-weight:700;text-decoration:none}.bar a.dl:hover{color:#d4af37}
.x{width:40px;height:40px;border-radius:50%;border:1px solid #d4af37;background:#d4af37;color:#091426;font:700 1.35rem/1 Arial,sans-serif;cursor:pointer}.x:hover,.x:focus-visible{background:#fff;outline:none}
.pg{flex:1 1 auto;overflow:auto;padding:14px 8px 40px;-webkit-overflow-scrolling:touch}
.pg canvas{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.msg{color:#dfe5ee;text-align:center;padding:40px 16px;font-size:15px;line-height:1.6}.msg a{color:#d4af37;font-weight:700}
@media(max-width:480px){.bar span{font-size:14px}}</style></head><body>
<div class="bar"><span id="t">PDF</span><div class="r"><a class="dl" id="dl" href="#" download>Download PDF</a><button class="x" type="button" id="x" aria-label="Close and return">&times;</button></div></div>
<div class="pg" id="pg"><div class="msg" id="m">Loading…</div></div>
<script type="module">
var FILES={guide:['Study Connections Guide','assets/zay-marie-press-study-connections-guide.pdf','study-connections.html'],questions:['Questions Readers Ask','assets/zay-marie-press-questions-readers-ask.pdf','digital-studies.html']};
var k=new URLSearchParams(location.search).get('f'),f=FILES[k]||FILES.guide;
document.getElementById('t').textContent=f[0];document.title=f[0]+' | Zay-Marie Press';document.getElementById('dl').href=f[1];
document.getElementById('x').addEventListener('click',function(){try{window.close()}catch(e){}setTimeout(function(){location.replace('/'+f[2])},120)});
var pg=document.getElementById('pg'),m=document.getElementById('m');
function fail(){m.innerHTML='The viewer could not load here. <a href="'+f[1]+'">Open the PDF directly</a> or use Download PDF above.';}
try{
 var lib=await import('./assets/pdfjs/pdf.min.mjs');
 lib.GlobalWorkerOptions.workerSrc='./assets/pdfjs/pdf.worker.min.mjs';
 var doc=await lib.getDocument({url:f[1]}).promise;m.remove();
 var dpr=Math.min(window.devicePixelRatio||1,2),w=Math.min(pg.clientWidth-16,900);
 var holders=[];
 for(var i=1;i<=doc.numPages;i++){var c=document.createElement('canvas');c.dataset.p=i;c.width=w;c.height=Math.round(w*1.5);c.style.width=w+'px';c.style.maxWidth='100%';pg.appendChild(c);holders.push(c)}
 async function draw(c){if(c.dataset.done)return;c.dataset.done=1;var p=await doc.getPage(+c.dataset.p),v0=p.getViewport({scale:1}),s=(w/v0.width)*dpr,v=p.getViewport({scale:s});c.width=Math.floor(v.width);c.height=Math.floor(v.height);c.style.aspectRatio=c.width+' / '+c.height;c.style.height='auto';await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)draw(e.target)})},{root:pg,rootMargin:'800px 0px'});
 holders.forEach(function(c){io.observe(c)});
}catch(e){console.error(e);fail()}
</script></body></html>
